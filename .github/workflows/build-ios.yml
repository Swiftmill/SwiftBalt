name: Build iOS .IPA (Sideload)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Compile iOS .IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Build Web Production Bundle
        working-directory: ./frontend
        run: |
          npm run build

      - name: Sync Capacitor iOS Project
        working-directory: ./frontend
        run: |
          npx cap sync ios

      - name: Build Xcode Archive (No Code Sign Required)
        working-directory: ./frontend/ios/App
        run: |
          mkdir -p build
          xcodebuild clean archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package into Sideloadable .IPA
        working-directory: ./frontend/ios/App/build
        run: |
          mkdir -p Payload
          APP_PATH=$(find App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/SwiftBalt.app
          zip -qr SwiftBalt.ipa Payload
          ls -lh SwiftBalt.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftBalt-iOS-Sideload-IPA
          path: frontend/ios/App/build/SwiftBalt.ipa
          if-no-files-found: error
          retention-days: 14
