name: Build Linux AppImage & DEB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse

      - name: Build Python Backend with PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
          pyinstaller --clean --noconfirm swiftbalt-backend.spec
          chmod +x dist/swiftbalt-backend/swiftbalt-backend
          mkdir -p frontend/src-tauri/resources/swiftbalt-backend
          cp -r dist/swiftbalt-backend/* frontend/src-tauri/resources/swiftbalt-backend/

      - name: Build React Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build Tauri AppImage & DEB (No Admin Required)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: --bundles appimage,deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwiftBalt-Linux
          path: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
